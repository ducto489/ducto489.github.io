name: Axe accessibility testing

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Path to check, for example projects/"
        required: false

permissions:
  contents: read

env:
  URL: ""

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.2"
          bundler-cache: true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install --yes imagemagick
          convert -version

      - name: Build site
        run: |
          export JEKYLL_ENV=production
          bundle exec jekyll build
          npx --yes purgecss@6.0.0 -c purgecss.config.js

      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2

      - name: Run axe
        run: |
          npm install -g @axe-core/cli@4.10.2 http-server@14.1.1
          http-server _site/ &
          axe "http://localhost:8080/${{ github.event.inputs.url || env.URL }}" --load-delay=1500 --exit
